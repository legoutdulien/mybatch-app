<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest-partenaire.json">
<meta name="theme-color" content="#FAF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="my batch">

<title>my batch — Espace Partenaire</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dgoqyp3wn/image/upload/v1774719838/ChatGPT_Image_28_mars_2026_18_37_48_u200aw.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="my batch · Partenaire">
<meta name="theme-color" content="#2d5a3d">
<link rel="manifest" href="/manifest-partenaire.json">
<style>
:root{--vert:#3d6b4f;--vc:#5a8a6a;--vp:#eef4f0;--bg:#f8f4ee;--bgd:#ede7db;--tx:#2c2c2c;--txl:#6b6b6b;--wh:#fff;--sh:0 4px 24px rgba(0,0,0,.08);--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none}
header{background:var(--vert);padding:0 24px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;height:calc(64px + env(safe-area-inset-top));position:sticky;top:0;z-index:100}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#fff}
.logo span{font-size:12px;font-weight:400;opacity:.7;display:block;margin-top:-2px}
.hbtn{padding:7px 14px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:8px;font-size:13px;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif}
#pLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg),var(--vp));padding:20px}
.lcard{background:var(--wh);border-radius:24px;padding:44px 36px;width:100%;max-width:400px;box-shadow:var(--sh);text-align:center}
.llogo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--vert);margin-bottom:4px}
.ltag{font-size:13px;color:var(--txl);margin-bottom:28px}
.fg{margin-bottom:14px;text-align:left}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--txl);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input{width:100%;padding:12px 15px;border:1.5px solid var(--bgd);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--tx);background:var(--bg);outline:none;transition:border-color .2s}
.fg input:focus{border-color:var(--vert);background:var(--wh)}
.btnLogin{width:100%;padding:13px;background:var(--vert);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:4px}
.btnLogin:hover{background:var(--vc)}
.lerr{background:#fdecea;color:#c62828;padding:10px;border-radius:9px;font-size:13px;margin-top:10px;display:none}
#pSalarie{display:none}
.main{padding:28px 24px calc(90px + env(safe-area-inset-bottom));max-width:800px;margin:0 auto}
.welcome{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:6px}
.welcome-sub{font-size:14px;color:var(--txl);margin-bottom:28px}
.sem-nav{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.sem-select{padding:9px 14px;border:1.5px solid var(--bgd);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--wh);color:var(--tx);cursor:pointer;outline:none}
.sem-select:focus{border-color:var(--vert)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--wh);border-radius:var(--r);padding:16px;box-shadow:var(--sh);text-align:center}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--vert)}
.stat-lbl{font-size:12px;color:var(--txl);margin-top:3px}
.stit{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;margin-bottom:14px}
.mission-card{background:var(--wh);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-bottom:14px;border-left:4px solid var(--vert)}
.mission-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.mission-date{font-size:13px;font-weight:600;color:var(--vert);margin-bottom:2px}
.mission-creneau{font-size:14px;font-weight:600}
.client-info{background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.client-nom{font-size:15px;font-weight:600;margin-bottom:6px}
.client-detail{font-size:13px;color:var(--txl);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.plats-section{margin-top:12px}
.plat-item{background:var(--bg);border-radius:10px;margin-bottom:8px;overflow:hidden}
.plat-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:14px;user-select:none}
.plat-header:hover{background:var(--bgd)}
.plat-arrow{transition:transform .2s;font-size:12px}
.plat-ings{display:none;padding:0 14px 12px}
.plat-ings.open{display:block}
.ing-line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bgd);font-size:13px}
.ing-line:last-child{border-bottom:none}
.ing-qte{color:var(--txl);font-size:12px}
.empty{text-align:center;padding:48px;color:var(--txl)}
.empty-icon{font-size:48px;margin-bottom:12px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.mbg.show{display:flex}
.mbox{background:var(--wh);border-radius:20px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:24px}
.mclose{width:100%;padding:12px;background:var(--bgd);border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:14px}
.cal-semaine{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:20px}
.cal-jour{background:var(--wh);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.cal-jour-header{background:var(--vert);color:#fff;padding:8px 10px;font-size:12px;font-weight:600}
.cal-jour-header span{font-size:10px;opacity:.7;display:block}
.cal-slot{padding:7px 9px;border-bottom:1px solid var(--bgd);font-size:11px}
.cal-slot:last-child{border-bottom:none}
.cal-slot-heure{font-weight:600;color:var(--vert);font-size:10px;margin-bottom:1px}
.cal-slot.moi{background:var(--vp);cursor:pointer}
.cal-slot.vide{color:var(--txl);font-style:italic}
.cal-mois{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cmh{text-align:center;font-size:10px;font-weight:600;color:var(--txl);text-transform:uppercase;padding:4px 0}
.cmd{background:var(--wh);border-radius:6px;min-height:60px;padding:4px;box-shadow:var(--sh)}
.cmd.autre{opacity:.3}
.cmd.today{border:2px solid var(--vert)}
.cmd-num{font-size:11px;font-weight:600;margin-bottom:2px}
.cmd-ev{font-size:9px;background:var(--vp);color:var(--vert);border-radius:3px;padding:1px 4px;margin-bottom:1px}
.lov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spin{width:34px;height:34px;border:3px solid var(--bgd);border-top-color:var(--vert);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:14px;color:var(--txl)}
@media(max-width:640px){
  header{padding:0 14px;height:54px}
  .logo img{height:30px}
  .hbtn{padding:6px 10px;font-size:12px}
  .main{padding:16px 14px calc(92px + env(safe-area-inset-bottom))}
  .welcome{font-size:20px}
  .stats-row{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{padding:12px}
  .stat-num{font-size:22px}
  #btnListe,#btnSem,#btnMois{padding:8px 14px;font-size:12px}
  .mission-card{padding:16px}
  .mission-header{flex-direction:column;gap:8px}
  .mission-creneau{font-size:13px}
  .client-nom{font-size:14px}
  .client-detail{font-size:12px}
  .cal-semaine{grid-template-columns:repeat(5,minmax(120px,1fr));overflow-x:auto;-webkit-overflow-scrolling:touch}
  .cal-mois{gap:2px}
  .cmd{min-height:48px;padding:3px}
  .cmd-num{font-size:10px}
  .cmd-ev{font-size:8px;padding:1px 3px}
  .sem-select{width:100%;font-size:13px}
  .mbox{border-radius:20px 20px 0 0;position:fixed;bottom:0;left:0;right:0;max-width:100%}
  .mbg{align-items:flex-end;padding:0}
}
@media(max-width:380px){
  .stats-row{grid-template-columns:1fr}
  #btnListe,#btnSem,#btnMois{padding:7px 10px;font-size:11px}
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fade-in{animation:fadeInUp .55s cubic-bezier(.16,.84,.44,1) backwards}
.mbg.show .mbox{animation:scaleIn .28s cubic-bezier(.16,.84,.44,1) backwards}
.mission-card,.stat-card{transition:transform .25s cubic-bezier(.16,.84,.44,1),box-shadow .25s ease}
.mission-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.08)}
.btnLogin,.hbtn{transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btnLogin:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(61,107,79,.3)}
.btnLogin:active{transform:translateY(0)}
.login-bg-svg{position:fixed;pointer-events:none;opacity:.07;z-index:0}
#pLogin .lcard{position:relative;z-index:1;animation:fadeInUp .6s cubic-bezier(.16,.84,.44,1) backwards}
.welcome-hero{background:linear-gradient(135deg,var(--vert),var(--vc));color:#fff;border-radius:20px;padding:24px 26px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(61,107,79,.18)}
.welcome-hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);top:-90px;right:-50px;pointer-events:none}
.welcome-hero .wdate{font-size:11px;opacity:.78;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;position:relative;z-index:1}
.welcome-hero .wtit{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;position:relative;z-index:1;line-height:1.1}
.welcome-hero .wsub{font-size:13px;opacity:.88;margin-top:6px;position:relative;z-index:1}
.welcome-hero .wleaf{position:absolute;top:50%;right:18px;transform:translateY(-50%);width:64px;height:64px;opacity:.18;z-index:0}
.ptabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--wh);border-top:1px solid var(--bgd);z-index:200;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 14px rgba(0,0,0,.07)}
.ptab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;background:none;border:none;color:var(--txl);font-family:'DM Sans',sans-serif;font-size:10px;line-height:1.1;cursor:pointer;transition:.15s}
.ptab .pt-ic{font-size:21px;line-height:1}
.ptab.active{color:var(--vert)}
.ptab.active .pt-lb{font-weight:700}
.section-card{background:var(--wh);box-shadow:var(--sh);border-radius:var(--r);padding:18px 20px}
.notif-bell{position:relative;padding:6px 11px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:8px;font-size:14px;color:#fff;cursor:pointer;line-height:1;font-family:'DM Sans',sans-serif;transition:.15s}
.notif-bell:hover{background:rgba(255,255,255,.25)}
.notif-bell-badge{position:absolute;top:-6px;right:-6px;background:#e63946;color:#fff;border-radius:10px;padding:0 5px;font-size:10px;font-weight:700;min-width:18px;height:18px;display:none;align-items:center;justify-content:center;line-height:1;border:2px solid var(--vert)}
.notif-bell-badge.show{display:flex}
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;background:var(--wh);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);width:330px;max-width:calc(100vw - 24px);max-height:60vh;overflow-y:auto;display:none;z-index:300;color:var(--tx)}
.notif-panel.show{display:block}
.notif-panel-head{padding:14px 16px;border-bottom:1px solid var(--bgd);font-size:13px;font-weight:600;color:var(--vert);position:sticky;top:0;background:var(--wh);z-index:1}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--bgd);cursor:pointer;transition:background .15s}
.notif-item:hover{background:var(--bg)}
.notif-item:last-child{border-bottom:none}
.notif-item.unread{background:var(--vp)}
.notif-item.unread .notif-title{font-weight:600;color:var(--vert)}
.notif-title{font-size:14px;margin-bottom:3px;line-height:1.3}
.notif-body{font-size:12px;color:var(--txl);line-height:1.5}
.notif-time{font-size:10px;color:var(--txl);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
.notif-empty{padding:30px 20px;text-align:center;color:var(--txl);font-size:13px}
@media(max-width:640px){
  .welcome-hero{padding:20px;border-radius:16px}
  .welcome-hero .wtit{font-size:22px}
  .welcome-hero .wleaf{width:50px;height:50px;right:10px}
}
</style>
</head>
<body>
<div class="lov" id="lov" style="display:flex"><div class="spin"></div><div class="ltxt">Connexion…</div></div>

<!-- LOGIN -->
<div id="pLogin">
  <svg class="login-bg-svg" style="top:8%;left:6%;width:140px" viewBox="0 0 100 100" fill="#3d6b4f"><path d="M50 10 Q60 30 50 50 Q40 30 50 10 M50 50 Q60 70 50 90 Q40 70 50 50 M30 50 Q50 60 70 50 M50 30 Q40 50 50 70"/></svg>
  <svg class="login-bg-svg" style="bottom:10%;right:8%;width:110px" viewBox="0 0 100 100" fill="#3d6b4f"><path d="M20 50 Q35 20 50 50 Q35 80 20 50 M50 50 Q65 20 80 50 Q65 80 50 50"/></svg>
  <svg class="login-bg-svg" style="top:55%;left:15%;width:70px" viewBox="0 0 100 100" fill="#3d6b4f"><circle cx="50" cy="50" r="20"/><path d="M50 30 Q70 50 50 70 Q30 50 50 30"/></svg>
  <div class="lcard">
    <div style="font-size:30px;font-weight:800;letter-spacing:-.03em;color:#1a1a1a;text-align:center;margin:0 auto 12px">my batch<span style="color:#E8843D">.</span></div>
    <div class="ltag">Espace partenaire - Mon planning</div>
    <div class="fg"><label>Email</label><input type="email" id="iEmail" placeholder="votre adresse"></div>
    <div class="fg"><label>Mot de passe</label><input type="password" id="iMdp" placeholder="••••••••"></div>
    <button class="btnLogin" id="btnLogin">Acceder a mon planning</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<!-- PLANNING -->
<div id="pSalarie">
  <header>
    <div class="logo" style="font-size:20px;font-weight:800;letter-spacing:-.03em;color:#1a1a1a">my batch<span style="color:#E8843D">.</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <div style="position:relative">
        <button class="notif-bell" id="notifBell">🔔<span class="notif-bell-badge" id="notifBellBadge">0</span></button>
        <div class="notif-panel" id="notifPanel"></div>
      </div>
      <button class="hbtn" id="btnLogout">Deconnexion</button>
    </div>
  </header>
  <div class="main">
    <div class="welcome-hero">
      <svg class="wleaf" viewBox="0 0 100 100" fill="#fff"><path d="M50 8 Q70 30 60 55 Q80 60 78 88 Q60 78 55 55 Q35 50 22 70 Q22 45 40 38 Q35 18 50 8"/></svg>
      <div class="wdate" id="welcomeDate"></div>
      <div class="wtit" id="welcomeTxt">Bonjour !</div>
      <div class="wsub">Voici vos missions de la semaine</div>
    </div>
    <div class="ptabs" id="ptabs">
      <button class="ptab active" data-ptab="planning"><span class="pt-ic">📋</span><span class="pt-lb">Planning</span></button>
      <button class="ptab" data-ptab="creneaux"><span class="pt-ic">🕐</span><span class="pt-lb">Créneaux</span></button>
      <button class="ptab" data-ptab="recettes"><span class="pt-ic">🍽️</span><span class="pt-lb">Recettes</span></button>
      <button class="ptab" data-ptab="forfaits"><span class="pt-ic">📦</span><span class="pt-lb">Forfaits</span></button>
      <button class="ptab" data-ptab="paiement"><span class="pt-ic">💳</span><span class="pt-lb">Paiement</span></button>
      <button class="ptab" data-ptab="clientes"><span class="pt-ic">👥</span><span class="pt-lb">Clientes</span></button>
    </div>

    <div class="ptab-panel" id="panelPlanning">
      <div class="sem-nav">
        <select class="sem-select" id="semSelect"></select>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
        <button id="btnListe" style="padding:9px 18px;background:var(--vert);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer">Liste</button>
        <button id="btnSem" style="padding:9px 18px;background:var(--bgd);color:var(--tx);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer">Semaine</button>
        <button id="btnMois" style="padding:9px 18px;background:var(--bgd);color:var(--tx);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer">Mois</button>
      </div>
      <div id="calSemDiv" style="display:none;margin-bottom:20px">
        <select class="sem-select" id="calSemSelect"></select>
      </div>
      <div id="calMoisDiv" style="display:none;margin-bottom:20px">
        <select class="sem-select" id="calMoisSelect"></select>
      </div>
      <div id="calContainer" style="display:none"></div>
      <div class="stit" id="listeTitre">Mes missions</div>
      <div id="missionsDiv"></div>
    </div>

    <div class="ptab-panel" id="panelCreneaux" style="display:none">
      <div class="stit">🕐 Mes créneaux</div>
      <div class="section-card"><div id="mesCreneauxBody"></div></div>
    </div>
    <div class="ptab-panel" id="panelRecettes" style="display:none">
      <div class="stit">🍽️ Mes recettes</div>
      <div class="section-card"><div id="mesRecettesBody"></div></div>
    </div>
    <div class="ptab-panel" id="panelForfaits" style="display:none">
      <div class="stit">📦 Mes forfaits</div>
      <div class="section-card"><div id="mesForfaitsBody"></div></div>
    </div>
    <div class="ptab-panel" id="panelPaiement" style="display:none">
      <div class="stit">💳 Mes modalités de paiement</div>
      <div class="section-card"><div id="monPaiementBody"></div></div>
    </div>
    <div class="ptab-panel" id="panelClientes" style="display:none">
      <div class="stit">👥 Mes clientes</div>
      <div class="section-card"><div id="mesClientesBody"></div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="salarie.js"></script>
</body>
</html>
